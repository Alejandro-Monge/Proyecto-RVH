# Approach OCCUPANCY zones for the Rusia site — a NEW layer, independent of the
# causal pipeline.
#
# A FILE SEPARATE from zones.yaml ON PURPOSE: zones.yaml is pinned by md5 in the
# guard of the causal command and of the figures; this layer iterates with its own
# life cycle and must not break those pins. It will be pinned in common.py when the layer closes.
#
# CONTRACT (identical to zones.yaml): coordinates in PIXELS at full resolution
# (1200x646), ORDERED vertices with implicit closing last->first, membership
# by the GROUND-CONTACT point (gx, gy) = ((x1+x2)/2, y2).
#
# ORIENTATION: entry_side = [0, 1] -> the v0->v1 edge is the ENTRY side
# (outer, back of the queue); the exit side is toward the arm's stop line
# (stop_lines of zones.yaml). Validated BLOCKING when drawing and when loading: the entry
# edge must lie farther from the stop line than the polygon's centroid.
#
# COUNTING SEMANTICS (two levels): arm = inside the 'arm' polygon (reliable at the
# back); lane k = inside lanes[k] (independent depth, coverage
# declared below); inside-arm-outside-lanes = the residual channel 'sin_carril'.
# Fallback to a neighboring lane is FORBIDDEN. INSTANTANEOUS per-frame count (no speed
# threshold; a speed-based variant = a future refinement with sensitivity).
#
# DECLARED COVERAGES (over the preview and the measured purity data): north
# and east full in 1-3; west c1 full, c2/c3 partial
# (c2/c3 overlap = declared sensor limit; tid76 GT-c3 runs along the c2 band);
# south c1 full, c2 MINIMAL partial (~1 position, 17 px), c3 partial. The shortest
# lane will be the noisiest against GT: declared, it is not lengthened.

