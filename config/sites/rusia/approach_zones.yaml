# --- Working point of the occupancy MEASUREMENT layer ---
# Calibrated by a joint theta x g sweep against the count series of the occupancy GT
# (scripts/measure_occupancy_accuracy.py --sweep).
# Chosen INSIDE the flat plateau of the MAE (0.103-0.106 in theta [0,1.5] x g [0.5,1.0])
# for the EVENTS tradeoff: fragments 149->20 and ghosts 17->1, at the cost of 4 short
# free-flow transits in the south (0.3-0.8 s) that are not queue — it prioritizes occupancy
# fidelity (dammed-up demand) over ephemeral transits. NOT chosen by MAE (indistinguishable
# across the whole plateau).
# CAUSALITY (design contract): theta = ACCUMULATED dwell up to the present frame
# (a condition over the past); g merges when the second fragment has ALREADY appeared. Neither reads
# the future; both are bounded latency, like the reconstructor's R2 retirement.
# DECLARED LIMITS (not corrected by threshold): IN-SAMPLE calibration over the single
# 180 s clip — it does NOT migrate to the paper as validation; a structural floor of ~0.10 veh of MAE and a deficit
# localized in south/c3 (queue censored at far field) = a SENSOR limit.
measurement:
  theta_s: 0.75        # minimum dwell in the zone to count (s)
  merge_gap_s: 0.5     # merge of presence gaps of the same track (s)

# --- Presentation of the vision shadow (NOT a metric; here and not in zones.yaml
# because zones.yaml is pinned and this iterates with its own cycle) ---
presentation:
  # PRESENTATION bound of the HANDOFF marker (box->vehicle bridge): a HELD
  # marker is retired if the vehicle does not appear within this time (crossing NOT materialized).
  # It is a presentation CAP, NOT a prediction: at runtime the registry NEVER
  # queries delay/cross_t/inst_t. Value INFORMED (not derived) by the range of
  # observed instantiation lags (~0.1-0.5 s, median ~0.37 s): 2.0 s = ~5x the
  # median, a wide margin. Sensitivity: most handoffs die earlier from
  # "vid appears" (<0.5 s); lowering it risks retiring a legitimate bridge (flicker),
  # raising it leaves a ghost for longer. It does NOT affect metrics (contract 3.4).
  handoff_max_hold_s: 2.0
