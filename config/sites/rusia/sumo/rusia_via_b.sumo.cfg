<?xml version="1.0" encoding="UTF-8"?>
<!--
  Via B — CANONICAL cfg for the dedicated rvh-veins container (SUMO+VEINS inside,
  driver on the host through the published port 127.0.0.1:8873).
  Supersedes rusia_via_b_host.sumo.cfg (host topology dropped because of ufw; kept
  as legacy).

  - OUR network (intersection_rusia.net.xml from this directory, J5 = 19 links, the same
    one the reference reconstruction builds trajectories against). Audit 2026-07-02: VEINS
    does not read the TLS (trafficLightModuleType default "" and the collaborator's ini does
    not set it -> no TL module); its 17-state add.xml was only SUMO control of the traffic
    signal and does NOT load on this network -> it is not used.
  - TLS NEUTRALIZED with tls.all-off (available in SUMO 1.12): on Via B the motion is
    imposed by moveToXY (speedMode 0 already ignores traffic signals); turning it off makes
    explicit that no component controls or obeys the traffic signal (project scope: no
    signal control). To REPRESENT the real plan, it would be a 19-state add.xml derived from
    the observed one — an architecture decision, not one for this cfg.
  - traci_server: port 8873 + num-clients 2 (VEINS order=1 inside; driver order=2 from
    the host). The simulation does not start until both connect.
  - No route-files: demand is inserted by the driver over TraCI (shadow replay).
  - processing: options verified in the PoC for position-driven replay (SUMO must not
    remove vehicles by collision/teleport: it would break the accounting Veins assumes).
  - time: collaborator horizon (end=240); step 0.05 s (recon phase: ~20 Hz smoothness;
    the VEINS updateInterval stays at 0.1 s, multi-client compatible).
-->
<configuration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
               xsi:noNamespaceSchemaLocation="http://sumo.dlr.de/xsd/sumoConfiguration.xsd">

    <input>
        <net-file value="intersection_rusia.net.xml"/>
    </input>

    <time>
        <begin value="0"/>
        <end value="240"/>
        <step-length value="0.05"/>
    </time>

    <traci_server>
        <remote-port value="8873"/>
        <num-clients value="2"/>
    </traci_server>

    <processing>
        <collision.action value="none"/>
        <time-to-teleport value="-1"/>
        <ignore-route-errors value="true"/>
        <tls.all-off value="true"/>
    </processing>

    <report>
        <no-step-log value="true"/>
    </report>

</configuration>
