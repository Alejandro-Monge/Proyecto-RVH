<?xml version="1.0" encoding="UTF-8"?>
<!--
  Via B — native SUMO on the HOST, multi-client (VEINS reads, driver writes).
  ADDITIVE: it neither modifies nor duplicates the collaborator's files; it references them
  by relative path (sombra_mensajes/veins_sumo_simulacion/). Replaces the veins_launchd:
  whoever launches this SUMO passes it the files by hand.

  - COLLABORATOR network and TLS: their add.xml (observed program of J5) has 17 states
    and only loads on THEIR network (our copy in config/sites/rusia/sumo/ was edited
    on 2026-07-02 and its J5 has 19 links -> incompatible with the add.xml). The decision
    of which network the definitive driver uses is PENDING in architecture; this cfg fixes
    the conservative baseline (collaborator's chain intact).
  - traci_server: fixed port 8873 + num-clients 2 (VEINS order=1, driver order=2).
    The simulation does not start until both clients connect (official SUMO doc).
  - No route-files: demand is inserted by the driver over TraCI (shadow replay).
  - processing: options verified in the PoC for position-driven replay
    (scripts/poc_via_b/poc_two_clients.py): SUMO must not remove vehicles on its
    own (collision/teleport) because it would break the departed-arrived accounting that
    Veins assumes (ASSERT in TraCIScenarioManager.cc:999).
  - time: same horizon as the collaborator's scenario (end=240, step 0.1 s,
    rusia_v2i_observed_v2.sumo.cfg:15-19).
-->
<configuration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
               xsi:noNamespaceSchemaLocation="http://sumo.dlr.de/xsd/sumoConfiguration.xsd">

    <input>
        <net-file value="../../../../sombra_mensajes/veins_sumo_simulacion/intersection_rusia.net.xml"/>
        <additional-files value="../../../../sombra_mensajes/veins_sumo_simulacion/rusia_j5_tls_observed_v2.add.xml"/>
    </input>

    <time>
        <begin value="0"/>
        <end value="240"/>
        <step-length value="0.1"/>
    </time>

    <traci_server>
        <remote-port value="8873"/>
        <num-clients value="2"/>
    </traci_server>

    <processing>
        <collision.action value="none"/>
        <time-to-teleport value="-1"/>
        <ignore-route-errors value="true"/>
    </processing>

    <report>
        <no-step-log value="true"/>
    </report>

</configuration>
